[workspace]
resolver = "2"
members = ["engine", "protocol", "server", "engine-python"]

# `resolver = "2"` : version moderne du résolveur de dépendances de Cargo
# (active par défaut pour toute édition >= 2021, mais on le déclare
# explicitement pour un workspace multi-crates : ça évite certaines
# incohérences de "feature unification" entre crates, ex. si un jour on active
# la feature "full" de tokio uniquement dans `server`).
