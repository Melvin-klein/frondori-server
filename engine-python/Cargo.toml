[package]
name = "engine-python"
version = "0.1.0"
edition = "2021"

# Module natif INTERNE (`frondori_engine._football`) : le paquet Python
# public (`python/frondori_engine/`) est écrit en Python par-dessus, et
# expose le football comme un environnement PettingZoo parmi d'autres. Le
# préfixe `_` signale qu'on n'est pas censé l'importer directement.
[lib]
name = "_football"
crate-type = ["cdylib"]

[dependencies]
# Chemin local, comme `protocol`/`server` le font déjà : ce crate n'est
# qu'une couche de traduction Python autour du moteur, pas une réécriture.
engine = { path = "../engine" }
pyo3 = { version = "0.29.2", features = ["extension-module"] }
