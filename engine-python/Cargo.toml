[package]
name = "engine-python"
version = "0.1.0"
edition = "2021"

# Le nom du module importé côté Python (`import frondori_engine`) — distinct
# du nom du crate Cargo, qui lui suit la convention du reste du workspace
# (dossier `engine-python`, avec un tiret).
[lib]
name = "frondori_engine"
crate-type = ["cdylib"]

[dependencies]
# Chemin local, comme `protocol`/`server` le font déjà : ce crate n'est
# qu'une couche de traduction Python autour du moteur, pas une réécriture.
engine = { path = "../engine" }
pyo3 = { version = "0.29.2", features = ["extension-module"] }
