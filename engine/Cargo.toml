[package]
name = "engine"
version = "0.1.0"
edition = "2021"

[dependencies]
# Moteur physique 2D. `features = ["simd-stable"]` accélère les calculs
# vectoriels sur les CPU récents ; on la retire si jamais ça pose problème
# sur la machine de build (portabilité).
rapier2d = { version = "0.22", features = ["simd-stable"] }

# Génération aléatoire *seedable* et déterministe (StdRng::seed_from_u64),
# utilisée pour toute décision "aléatoire" du moteur (position de coup
# d'envoi, remise en jeu...) afin de garder des replays reproductibles.
rand = "0.8"

# `derive` permet d'utiliser #[derive(Serialize, Deserialize)] sur nos
# structs/enums au lieu d'écrire la sérialisation à la main.
serde = { version = "1", features = ["derive"] }

# Remarque : `rand` est en [dependencies] (pas [dev-dependencies]) car le
# moteur lui-même en a besoin au runtime pour ses tirages déterministes.
# Les examples/tests dans engine/examples et engine/tests héritent
# automatiquement de [dependencies] ET [dev-dependencies].
