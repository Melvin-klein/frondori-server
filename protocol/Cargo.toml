[package]
name = "protocol"
version = "0.3.0"
edition = "2021"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }

# `protocol` expose aussi les fonctions `encode`/`decode` (MessagePack) : le
# format d'encodage sur le fil fait partie du contrat partagé entre serveur
# et SDK, donc rmp-serde vit ici plutôt que d'être dupliqué dans `server`.
rmp-serde = "1"

# Valeur MessagePack dynamique (`rmpv::Value`), l'équivalent d'un
# `serde_json::Value` pour MessagePack. Les observations et actions n'ont
# plus de type Rust fixe : leur forme dépend de l'environnement joué, et
# c'est lui (côté Python) qui la décrit et la valide, pas ce crate.
# `with-serde` : permet d'imbriquer une `Value` dans nos structs sérialisées.
rmpv = { version = "1.3.1", features = ["with-serde"] }
